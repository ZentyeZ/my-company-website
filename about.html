<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="了解爱诗伦 ACELYNN - 专注于生物科技研发与创新的高新技术企业">
    <meta name="keywords" content="爱诗伦,ACELYNN,关于我们,生物科技公司,企业使命">
    <meta name="author" content="爱诗伦生物科技（上海）有限公司">
    <meta name="theme-color" content="#0a4d94">
    <title>关于我们 - 爱诗伦 ACELYNN</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <img src="images/logo.svg" alt="ACELYNN 爱诗伦" class="logo">
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link" data-i18n="nav.home">首页</a>
                <a href="about.html" class="nav-link active" data-i18n="nav.about">关于我们</a>
                <a href="products.html" class="nav-link" data-i18n="nav.products">产品中心</a>
                <a href="news.html" class="nav-link" data-i18n="nav.news">新闻资讯</a>
                <a href="contact.html" class="nav-link" data-i18n="nav.contact">联系我们</a>
                <button class="lang-toggle" id="langToggle" aria-label="切换语言">EN</button>
            </div>
            <div class="hamburger" id="hamburger" aria-label="菜单" role="button" tabindex="0">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1 class="page-title" data-i18n="about.title">关于我们</h1>
        </div>
    </section>

    <section class="about-section">
        <div class="container">
            <div class="about-grid">
                <div class="about-content">
                    <h2 class="section-title" data-i18n="about.company">公司简介</h2>
                    <p class="about-text" id="aboutText"></p>
                    <p class="about-text" id="aboutText2"></p>
                </div>
                <div class="about-image">
                    <div class="lab-image" aria-hidden="true"></div>
                </div>
            </div>
        </div>
    </section>

    <section class="mission-section">
        <div class="container">
            <div class="mission-grid">
                <article class="mission-card">
                    <div class="mission-icon" aria-hidden="true">🎯</div>
                    <h3 data-i18n="about.mission">企业使命</h3>
                    <p id="missionText">以创新生物科技，助力人类健康事业发展</p>
                </article>
                <article class="mission-card">
                    <div class="mission-icon" aria-hidden="true">🌟</div>
                    <h3 data-i18n="about.vision">企业愿景</h3>
                    <p id="visionText">成为全球领先的生物科技解决方案提供商</p>
                </article>
                <article class="mission-card">
                    <div class="mission-icon" aria-hidden="true">💡</div>
                    <h3 data-i18n="about.values">核心价值观</h3>
                    <p id="valuesText">创新、专业、诚信、共赢</p>
                </article>
            </div>
        </div>
    </section>

    <section class="stats-section" aria-label="公司数据">
        <div class="container">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" data-target="10" data-suffix="+">0</div>
                    <div class="stat-label">年行业经验</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" data-target="500" data-suffix="+">0</div>
                    <div class="stat-label">产品种类</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" data-target="1000" data-suffix="+">0</div>
                    <div class="stat-label">合作客户</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" data-target="50" data-suffix="+">0</div>
                    <div class="stat-label">研发团队</div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-copyright" data-i18n="footer.copyright">© 2015 爱诗伦生物科技（上海）有限公司 All Rights Reserved.</p>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="返回顶部">↑</button>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
