<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 爱诗伦 ACELYNN</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <img src="images/logo.png" alt="ACELYNN 爱诗伦" class="logo">
            </div>
            <div class="nav-search">
                <div class="nav-search-wrapper">
                    <span class="search-icon-nav">🔍</span>
                    <input type="text" id="navSearch" class="nav-search-input" placeholder="搜索产品名称、CAS号、货号..." data-i18n-placeholder="hero.search">
                </div>
                <div class="nav-search-suggestions" id="navSearchSuggestions"></div>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link" data-i18n="nav.home">首页</a>
                <a href="about.html" class="nav-link" data-i18n="nav.about">关于我们</a>
                <a href="products.html" class="nav-link" data-i18n="nav.products">产品中心</a>
                <a href="news.html" class="nav-link" data-i18n="nav.news">新闻资讯</a>
                <a href="contact.html" class="nav-link active" data-i18n="nav.contact">联系我们</a>
                <button class="lang-toggle" id="langToggle">EN</button>
            </div>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1 class="page-title" data-i18n="contact.title">联系我们</h1>
        </div>
    </section>

    <section class="contact-section">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-info">
                    <h2 class="section-title" data-i18n="contact.info">联系方式</h2>
                    <div class="info-item">
                        <div class="info-icon">📍</div>
                        <div class="info-content">
                            <h4 data-i18n="contact.address">公司地址</h4>
                            <p id="contactAddress">上海市浦东新区生物科技园区888号</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-icon">📧</div>
                        <div class="info-content">
                            <h4 data-i18n="contact.email">电子邮箱</h4>
                            <p id="contactEmail">info@acelynn.com</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-icon">📞</div>
                        <div class="info-content">
                            <h4 data-i18n="contact.phone">联系电话</h4>
                            <p id="contactPhone">+86 21 1234 5678</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-icon">⏰</div>
                        <div class="info-content">
                            <h4 data-i18n="contact.hours">工作时间</h4>
                            <p id="contactHours">周一至周五 9:00 - 18:00</p>
                        </div>
                    </div>
                </div>
                <div class="contact-form">
                    <h2 class="section-title" data-i18n="contact.form">在线留言</h2>
                    <form id="contactForm">
                        <div class="form-group">
                            <label data-i18n="contact.name">姓名</label>
                            <input type="text" name="name" required>
                        </div>
                        <div class="form-group">
                            <label data-i18n="contact.emailField">邮箱</label>
                            <input type="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label data-i18n="contact.subject">主题</label>
                            <input type="text" name="subject" required>
                        </div>
                        <div class="form-group">
                            <label data-i18n="contact.message">留言内容</label>
                            <textarea name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" data-i18n="contact.submit">提交留言</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
