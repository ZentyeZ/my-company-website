<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="联系爱诗伦 ACELYNN - 我们期待与您的合作">
    <meta name="keywords" content="联系爱诗伦,ACELYNN联系方式,生物科技公司联系">
    <meta name="author" content="爱诗伦生物科技（上海）有限公司">
    <meta name="theme-color" content="#0a4d94">
    <title>联系我们 - 爱诗伦 ACELYNN</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <img src="images/logo.svg" alt="ACELYNN 爱诗伦" class="logo">
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link" data-i18n="nav.home">首页</a>
                <a href="about.html" class="nav-link" data-i18n="nav.about">关于我们</a>
                <a href="products.html" class="nav-link" data-i18n="nav.products">产品中心</a>
                <a href="news.html" class="nav-link" data-i18n="nav.news">新闻资讯</a>
                <a href="contact.html" class="nav-link active" data-i18n="nav.contact">联系我们</a>
                <button class="lang-toggle" id="langToggle" aria-label="切换语言">EN</button>
            </div>
            <div class="hamburger" id="hamburger" aria-label="菜单" role="button" tabindex="0">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1 class="page-title" data-i18n="contact.title">联系我们</h1>
        </div>
    </section>

    <section class="contact-section">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-info">
                    <h2 class="section-title" data-i18n="contact.info">联系方式</h2>
                    <div class="info-item">
                        <div class="info-icon">📍</div>
                        <div class="info-content">
                            <h4 data-i18n="contact.address">公司地址</h4>
                            <p id="contactAddress">上海市浦东新区生物科技园区888号</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-icon">📧</div>
                        <div class="info-content">
                            <h4 data-i18n="contact.email">电子邮箱</h4>
                            <p id="contactEmail">info@acelynn.com</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-icon">📞</div>
                        <div class="info-content">
                            <h4 data-i18n="contact.phone">联系电话</h4>
                            <p id="contactPhone">+86 21 1234 5678</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-icon">⏰</div>
                        <div class="info-content">
                            <h4 data-i18n="contact.hours">工作时间</h4>
                            <p id="contactHours">周一至周五 9:00 - 18:00</p>
                        </div>
                    </div>
                </div>
                <div class="contact-form">
                    <h2 class="section-title" data-i18n="contact.form">在线留言</h2>
                    <form id="contactForm" novalidate>
                        <div class="form-group">
                            <label for="name" data-i18n="contact.name">姓名 <span style="color: var(--error);">*</span></label>
                            <input type="text" id="name" name="name" required aria-required="true" aria-describedby="nameError">
                            <div class="form-error" id="nameError" role="alert"></div>
                        </div>
                        <div class="form-group">
                            <label for="email" data-i18n="contact.emailField">邮箱 <span style="color: var(--error);">*</span></label>
                            <input type="email" id="email" name="email" required aria-required="true" aria-describedby="emailError">
                            <div class="form-error" id="emailError" role="alert"></div>
                        </div>
                        <div class="form-group">
                            <label for="phone" data-i18n="contact.phone">联系电话 <span style="color: var(--error);">*</span></label>
                            <input type="tel" id="phone" name="phone" required aria-required="true" aria-describedby="phoneError">
                            <div class="form-error" id="phoneError" role="alert"></div>
                        </div>
                        <div class="form-group">
                            <label for="message" data-i18n="contact.message">留言内容 <span style="color: var(--error);">*</span></label>
                            <textarea id="message" name="message" rows="5" required aria-required="true" aria-describedby="messageError"></textarea>
                            <div class="form-error" id="messageError" role="alert"></div>
                        </div>
                        <button type="submit" class="btn btn-primary" data-i18n="contact.submit">提交留言</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-copyright" data-i18n="footer.copyright">© 2015 爱诗伦生物科技（上海）有限公司 All Rights Reserved.</p>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="返回顶部">↑</button>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
