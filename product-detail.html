<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品详情 - 爱诗伦 ACELYNN</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <img src="images/logo.svg" alt="ACELYNN 爱诗伦" class="logo">
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link" data-i18n="nav.home">首页</a>
                <a href="about.html" class="nav-link" data-i18n="nav.about">关于我们</a>
                <a href="products.html" class="nav-link" data-i18n="nav.products">产品中心</a>
                <a href="news.html" class="nav-link" data-i18n="nav.news">新闻资讯</a>
                <a href="contact.html" class="nav-link" data-i18n="nav.contact">联系我们</a>
                <button class="lang-toggle" id="langToggle">EN</button>
            </div>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1 class="page-title">产品详情</h1>
        </div>
    </section>

    <section class="product-detail-section">
        <div class="container">
            <div id="productNotFound" style="display: none; text-align: center; padding: 4rem 0;">
                <div style="font-size: 4rem; margin-bottom: 1rem;">📦</div>
                <h2 style="color: var(--text-dark); margin-bottom: 0.5rem;">产品未找到</h2>
                <p style="color: var(--text-gray); margin-bottom: 1.5rem;">抱歉，找不到您要查看的产品</p>
                <a href="products.html" class="btn btn-primary" style="display: inline-block;">返回产品列表</a>
            </div>
            
            <div id="productDetail" style="display: none;">
                <div class="product-detail-grid">
                    <div class="product-detail-image" id="productImageContainer">
                        <div class="product-detail-image-placeholder" id="productIcon">🧬</div>
                    </div>
                    <div class="product-detail-info">
                        <h1 class="product-detail-title" id="productName">产品名称</h1>
                        <div id="productChemicalName" style="font-size: 1.2rem; color: var(--primary-blue); margin-bottom: 1rem; font-style: italic; display: none;"></div>
                        <p class="product-detail-price" id="productPrice">¥0</p>
                        <p class="product-detail-desc" id="productDesc">产品描述</p>
                        
                        <div class="product-specs">
                            <div class="spec-item" id="specCas" style="display: none;">
                                <span class="spec-label">CAS号:</span>
                                <span class="spec-value" id="productCas">-</span>
                            </div>
                            <div class="spec-item" id="specCatalog" style="display: none;">
                                <span class="spec-label">货号:</span>
                                <span class="spec-value" id="productCatalog">-</span>
                            </div>
                            <div class="spec-item" id="specSpec" style="display: none;">
                                <span class="spec-label">规格:</span>
                                <span class="spec-value" id="productSpec">-</span>
                            </div>
                            <div class="spec-item" id="specPurity" style="display: none;">
                                <span class="spec-label">纯度:</span>
                                <span class="spec-value" id="productPurity">-</span>
                            </div>
                        </div>
                        
                        <div class="product-detail-actions">
                            <a href="contact.html" class="btn btn-primary">联系我们</a>
                            <a href="products.html" class="btn btn-secondary">返回列表</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        let currentProduct = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadProductDetail();
        });

        async function loadProductDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id') || sessionStorage.getItem('viewProductId');

            if (!productId) {
                showProductNotFound();
                return;
            }

            try {
                const data = await loadData();
                const product = data.products.find(p => p.id === parseInt(productId));

                if (!product) {
                    showProductNotFound();
                    return;
                }

                currentProduct = product;
                displayProductDetail(product);
            } catch (error) {
                console.error('加载产品详情失败:', error);
                showProductNotFound();
            }
        }
        
        function showProductNotFound() {
            document.getElementById('productNotFound').style.display = 'block';
            document.getElementById('productDetail').style.display = 'none';
        }
        
        function displayProductDetail(product) {
            document.getElementById('productNotFound').style.display = 'none';
            document.getElementById('productDetail').style.display = 'block';

            // 显示产品图片
            const imageContainer = document.getElementById('productImageContainer');
            const displayName = product.chemicalName || getLocalizedText(product.name);
            if (product.image && product.image.startsWith('data:image')) {
                imageContainer.innerHTML = `<img src="${product.image}" alt="${displayName}" class="product-detail-img">`;
            } else {
                imageContainer.innerHTML = `<div class="product-detail-image-placeholder">🧬</div>`;
            }

            document.getElementById('productName').textContent = displayName;

            document.getElementById('productPrice').textContent = product.price;
            document.getElementById('productDesc').textContent = getLocalizedText(product.desc);

            if (product.smiles) {
                const specsContainer = document.querySelector('.product-specs');
                const smilesDiv = document.createElement('div');
                smilesDiv.className = 'spec-item';
                smilesDiv.id = 'specSmiles';
                smilesDiv.innerHTML = `
                    <span class="spec-label">SMILES:</span>
                    <span class="spec-value" id="productSmiles">${product.smiles}</span>
                `;
                specsContainer.insertBefore(smilesDiv, specsContainer.firstChild);
            }

            if (product.casNumber) {
                document.getElementById('specCas').style.display = 'flex';
                document.getElementById('productCas').textContent = product.casNumber;
            }
            if (product.catalogNumber) {
                document.getElementById('specCatalog').style.display = 'flex';
                document.getElementById('productCatalog').textContent = product.catalogNumber;
            }
            if (product.specification) {
                document.getElementById('specSpec').style.display = 'flex';
                document.getElementById('productSpec').textContent = product.specification;
            }
            if (product.purity) {
                document.getElementById('specPurity').style.display = 'flex';
                document.getElementById('productPurity').textContent = product.purity;
            }
        }
        
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('acelynnLang', lang);
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            
            const langToggle = document.getElementById('langToggle');
            if (langToggle) {
                langToggle.textContent = lang === 'zh' ? 'EN' : '中';
            }
            
            updatePageContent();
            if (currentProduct) {
                displayProductDetail(currentProduct);
            }
        }
    </script>
</body>
</html>
