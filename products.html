<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="爱诗伦 ACELYNN 产品中心 - 提供高品质的生物试剂、试剂盒、仪器设备和实验耗材">
    <meta name="keywords" content="生物试剂,试剂盒,仪器设备,实验耗材,ACELYNN产品">
    <meta name="author" content="爱诗伦生物科技（上海）有限公司">
    <meta name="theme-color" content="#0a4d94">
    <title>产品中心 - 爱诗伦 ACELYNN</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <img src="images/logo.svg" alt="ACELYNN 爱诗伦" class="logo">
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link" data-i18n="nav.home">首页</a>
                <a href="about.html" class="nav-link" data-i18n="nav.about">关于我们</a>
                <a href="products.html" class="nav-link active" data-i18n="nav.products">产品中心</a>
                <a href="news.html" class="nav-link" data-i18n="nav.news">新闻资讯</a>
                <a href="contact.html" class="nav-link" data-i18n="nav.contact">联系我们</a>
                <button class="lang-toggle" id="langToggle" aria-label="切换语言">EN</button>
            </div>
            <div class="hamburger" id="hamburger" aria-label="菜单" role="button" tabindex="0">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1 class="page-title" data-i18n="products.pageTitle">产品中心</h1>
        </div>
    </section>

    <section class="products-section">
        <div class="container">
            <div class="filter-bar">
                <div class="search-box">
                    <input type="text" id="productSearch" placeholder="搜索产品名称、CAS号、货号..." data-i18n-placeholder="products.search" aria-label="搜索产品">
                    <button id="searchButton" class="search-button" aria-label="搜索" data-i18n="searchButton">搜索</button>
                </div>
            </div>

            <div id="searchResultsInfo"></div>
            <div id="hotProducts">
                <div class="section-header" style="margin-bottom: 2rem; margin-top: 3rem;">
                    <h2 class="section-title" data-i18n="products.title">热门产品</h2>
                </div>
                <div class="products-grid" id="hotProductsList">
                </div>
            </div>
            <div class="products-grid" id="productsList" style="display: none;">
            </div>
            <div id="noResults" style="display: none; text-align: center; padding: 4rem 0;">
                <div style="font-size: 4rem; margin-bottom: 1rem;">🔍</div>
                <h2 style="color: var(--text-dark); margin-bottom: 0.5rem;">未找到相关产品</h2>
                <p style="color: var(--text-gray);">请尝试其他关键词</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-copyright" data-i18n="footer.copyright">© 2015 爱诗伦生物科技（上海）有限公司 All Rights Reserved.</p>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="返回顶部">↑</button>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
